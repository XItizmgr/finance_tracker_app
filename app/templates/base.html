<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{%block title%}FinTrack{%endblock}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#fef8f3]">
    <div class="flex min-h-screen">
      <div class="flex w-64 flex-col bg-[#f9f2ee] px-5 py-6 border-r border-[#f3e9e0] shadow-[1px_0_6px_-1px_rgba(0,0,0,0.5)]">

                  <rect width="7" height="9" x="3" y="3" rx="1" />
                  <rect width="7" height="5" x="14" y="3" rx="1" />
                  <rect width="7" height="9" x="14" y="12" rx="1" />
                  <rect width="7" height="5" x="3" y="16" rx="1" />
                </svg>
                <span>Dashboard</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-[#594339] hover:bg-[#e3d8ce]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#533522" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                  <path d="M18 19V2l-2.5 1.5L13 2l-2.5 1.5L8 2L5.5 3.5 4 2" />
                  <line x1="8" y1="7" x2="14" y2="7" />

                <span>Transactions</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-[#594339] hover:bg-[#e3d8ce]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#533522" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="12 2 2 7 22 7 12 2" />

                  <line x1="2" y1="21" x2="22" y2="21" />
                  <line x1="4" y1="17" x2="20" y2="17" />

              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-[#594339] hover:bg-[#e3d8ce]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                  <circle cx="12" cy="12" r="3" />
                </svg>
                <span>Setting</span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="space-y-2 pt-4">
          <a href="#" class="block rounded-lg bg-[#9f3c00] px-4 py-3 text-center text-sm font-semibold text-white hover:bg-[#cc4e00] transition-colors">
            Upgrade Plan
          </a>
          <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-[#594339] hover:bg-[#e3d8ce]">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
