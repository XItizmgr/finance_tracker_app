<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}FinTrack{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}" />
  </head>
  <body class="bg-[#fef8f3] flex">
    <aside class="flex min-h-screen">
      <div class="flex w-64 flex-col bg-[#f9f2ee] px-5 py-6 border-r border-[#f3e9e0]">
        <div>
          <h1 class="font-bold text-xl text-[#b06533]">FinTrack</h1>
          <p class="text-sm text-[#b5a7a1]">Premium Plan</p>
        </div>

        <nav class="mt-10 flex-1">
          <ul class="space-y-2">
            <li>
              <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 bg-[#9e3c01] text-[#e6e8f3]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="7" height="9" x="3" y="3" rx="1" />
                  <rect width="7" height="5" x="14" y="3" rx="1" />
                  <rect width="7" height="9" x="14" y="12" rx="1" />
                  <rect width="7" height="5" x="3" y="16" rx="1" />
                </svg>
                <span>Dashboard</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-[#594339] hover:bg-[#e3d8ce]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#533522" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 2v14a3 3 0 0 0 3 3h14" />
                  <path d="M18 19V2l-2.5 1.5L13 2l-2.5 1.5L8 2L5.5 3.5 4 2" />
                  <line x1="8" y1="7" x2="14" y2="7" />
                  <line x1="8" y1="11" x2="14" y2="11" />
                  <circle cx="15.5" cy="7" r="0.75" fill="#533522" />
                  <circle cx="15.5" cy="11" r="0.75" fill="#533522" />
                </svg>
                <span>Transactions</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-[#594339] hover:bg-[#e3d8ce]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#533522" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="12 2 2 7 22 7 12 2" />
                  <line x1="5" y1="11" x2="5" y2="17" />
                  <line x1="12" y1="11" x2="12" y2="17" />
                  <line x1="19" y1="11" x2="19" y2="17" />
                  <line x1="2" y1="21" x2="22" y2="21" />
                  <line x1="4" y1="17" x2="20" y2="17" />
                </svg>
                <span>Accounts</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-[#594339] hover:bg-[#e3d8ce]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z" />
                  <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
                </svg>
                <span>Budget</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-[#594339] hover:bg-[#e3d8ce]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M11 17h3v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a3.16 3.16 0 0 0 2-2h1a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-1a5 5 0 0 0-2-4V3a4 4 0 0 0-3.2 1.6l-.3.4H11a6 6 0 0 0-6 6v1a5 5 0 0 0 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1z"
                  />
                  <path d="M16 10h.01" />
                  <path d="M2 8v1a2 2 0 0 0 2 2h1" />
                </svg>
                <span>Savings</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-[#594339] hover:bg-[#e3d8ce]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <span>Setting</span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="space-y-2 pt-4">
          <a href="#" class="block rounded-lg bg-[#9f3c00] px-4 py-3 text-center text-sm font-semibold text-white hover:bg-[#cc4e00] transition-colors"> Upgrade Plan </a>
          <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-[#594339] hover:bg-[#e3d8ce]">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" />
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
              <path d="M12 17h.01" />
            </svg>
            <span>Help Center</span>
          </a>
          <a href="#" class="flex items-center gap-4 rounded-lg px-4 py-3 text-[#594339] hover:bg-[#e3d8ce]">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m16 17 5-5-5-5" />
              <path d="M21 12H9" />
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            </svg>
            <span>Logout</span>
          </a>
        </div>
      </div>
    </aside>
    <main class="flex-1">
      <header class="h-20 bg-[#fff8f2] border-b-1 border-[#bfbfbf] flex items-center justify-between px-8">
        <h1 class="text-2xl font-semibold text-gray-800">{% block page_title %}Dashboard{% endblock %}</h1>
        <div class="flex items-center gap-6">
          <input type="search" placeholder="Search data" class="rounded-full bg-[#e6e0db] px-4 py-3 outline-none" />
          <button class="cursor-pointer">
            <?xml version="1.0" encoding="UTF-8"?><svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000">
              <path
                d="M18.1336 11C18.7155 16.3755 21 18 21 18H3C3 18 6 15.8667 6 8.4C6 6.70261 6.63214 5.07475 7.75736 3.87452C8.88258 2.67428 10.4087 2 12 2C12.3373 2 12.6717 2.0303 13 2.08949"
                stroke="#000000"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
              <path
                d="M19 8C20.6569 8 22 6.65685 22 5C22 3.34315 20.6569 2 19 2C17.3431 2 16 3.34315 16 5C16 6.65685 17.3431 8 19 8Z"
                stroke="#000000"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
              <path
                d="M13.73 21C13.5542 21.3031 13.3019 21.5547 12.9982 21.7295C12.6946 21.9044 12.3504 21.9965 12 21.9965C11.6496 21.9965 11.3054 21.9044 11.0018 21.7295C10.6982 21.5547 10.4458 21.3031 10.27 21"
                stroke="#000000"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
          </button>
          <div>
            <!-- profile -->
          </div>
        </div>
      </header>
      <section class="p-8">{% block content %} {% endblock %}</section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js">
      
    </script>
  </body>
</html>
